name = "unica-sync"
main = "worker.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "SYNC"
id = "INCOLLA_QUI_L_ID_DEL_NAMESPACE_KV"

[vars]
VAPID_SUBJECT = "mailto:tuo@indirizzo.it"
ALLOWED_ORIGIN = "https://IL-TUO-DOMINIO"   # l'indirizzo dove pubblichi Unica, senza barra finale

[triggers]
crons = ["0 * * * *"]   # ogni ora: invia i promemoria push in scadenza
